---
# Make the installed system start in the NextKDE session. Both Plasma Login
# Manager and SDDM are written because CachyOS moved between them; the one
# that is present on the installed system wins.
dontChroot: false
timeout: 60
script:
  - 'install -d ${ROOT}/etc/plasmalogin.conf.d ${ROOT}/etc/sddm.conf.d'
  - 'printf "[Autologin]\nSession=nextkde.desktop\nRelogin=false\n" > ${ROOT}/etc/plasmalogin.conf.d/10-nextkde.conf'
  - 'printf "[Autologin]\nSession=nextkde.desktop\n" > ${ROOT}/etc/sddm.conf.d/10-nextkde.conf'
